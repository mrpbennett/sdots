"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 200
format = "$hostname[$directory$git_branch$git_status]($style)$line_break$character"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[➜](bold green)"

vimcmd_symbol = '[N](bold blue) '
vimcmd_visual_symbol = '[V](bold yellow)'

[hostname]
ssh_only = true
format = "[$hostname](bold green) "
disabled = false

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "

[git_status]
format = '[$all_status]($style)'
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""
